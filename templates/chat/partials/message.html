{% if message.role == "user" %}
<div class="message user">
    <div class="message-avatar user">You</div>
    <div class="message-content user">
        {{ message.content|linebreaksbr }}
    </div>
</div>
{% else %}
<div class="message">
    <div class="message-avatar assistant">
        <i class="bi bi-robot"></i>
    </div>
    <div class="message-content assistant">
        {{ message.content|linebreaksbr }}
        {% if message.metadata.sources %}
        <div class="message-sources">
            <strong><i class="bi bi-link-45deg me-1"></i>Sources:</strong>
            {% for source in message.metadata.sources %}
            <span class="source-chip">{{ source.document_title|default:"Unknown" }}</span>
            {% endfor %}
        </div>
        {% endif %}
        <div class="message-actions">
            <button type="button" title="Copy" onclick="copyMessage(this)">
                <i class="bi bi-clipboard"></i>
            </button>
        </div>
    </div>
</div>
{% endif %}
