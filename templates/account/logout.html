{% extends "base.html" %}

{% block title %}Sign Out - {{ app_name }}{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="card">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="brand-logo mb-3">
                        <i class="bi bi-headset"></i> {{ app_name }}
                    </div>
                    <p class="auth-subtitle">Are you sure you want to sign out?</p>
                </div>

                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                    <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
                    {% endif %}

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
                    </button>
                </form>

                <div class="text-center">
                    <a href="{% url 'account_login' %}" class="text-decoration-none small" style="color: var(--primary); font-weight: 500;">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
