{% extends "base.html" %}

{% block title %}Password Reset Complete - {{ app_name }}{% endblock %}

{% block body %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="card">
            <div class="card-body">
                <div class="text-center">
                    <div class="brand-logo mb-4">
                        <i class="bi bi-headset"></i> {{ app_name }}
                    </div>

                    <div class="auth-success-icon">
                        <i class="bi bi-check-lg"></i>
                    </div>

                    <h4 class="mb-2 mt-3" style="font-weight: 700;">Password Reset Complete</h4>
                    <p class="text-muted mb-4" style="font-size: 0.9rem;">
                        Your password has been successfully reset.
                        You can now sign in with your new password.
                    </p>
                    <a href="{% url 'account_login' %}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
